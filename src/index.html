<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <title>MIAV ERP | Gestion d'Église</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- ═══ Open Graph par défaut ══════════════════════════════ -->
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://ekklesia-frontend.vercel.app/">
  <meta property="og:title"       content="MIAV — Logiciel de gestion d'église">
  <meta property="og:description" content="Mission Internationale Arbre de Vie — Logiciel de gestion d'église.">
  <meta property="og:image"       content="https://ekklesia-frontend.vercel.app/logos/A%20New%20Design%20-%20Fait%20avec%20PosterMyWall.png">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale"      content="fr_CI">
  <meta property="og:site_name"   content="MIAV — Logiciel de gestion d'église">

  <meta name="description" content="Mission Internationale Arbre de Vie — Logiciel de gestion d'église.">


  <!-- Utilisation de l'emoji croix comme favicon inline (plus besoin de fichier favicon.ico) -->
  <link rel="icon" href="/logos/A New Design - Fait avec PosterMyWall.png">

  <!-- Polices Google : Public Sans (Moderne, épurée et très lisible pour un Dashboard professionnel) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link
    href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&amp;display=swap"
    rel="stylesheet" />

  <!-- Pack d'icônes Boxicons — EMBARQUÉ LOCALEMENT (plus de dépendance CDN :
       fonctionne hors-ligne et dans l'app mobile, où les icônes disparaissaient). -->
  <link rel="stylesheet" href="/vendor/boxicons/css/boxicons.min.css" />
  <link rel="manifest" href="manifest.webmanifest">

  <!-- ⏳ Écran de démarrage : affiché instantanément (avant Angular), retiré
       dès que l'application est prête. Évite l'impression de « page blanche ». -->
  <style>
    #miav-boot {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #ffffff;
      font-family: 'Public Sans', 'Segoe UI', sans-serif;
      transition: opacity .35s ease;
    }
    #miav-boot.miav-boot--hide { opacity: 0; pointer-events: none; }
    #miav-boot img { width: 128px; height: 128px; object-fit: contain; }
    #miav-boot .miav-boot-title { font-size: 20px; font-weight: 700; color: #0F3D2E; letter-spacing: .5px; }
    #miav-boot .miav-boot-sub { font-size: 13px; color: #64748b; }
    #miav-boot .miav-boot-spinner {
      width: 38px; height: 38px; border: 3px solid rgba(15,61,46,.15);
      border-top-color: #0F3D2E; border-radius: 50%; animation: miav-spin .9s linear infinite;
    }
    @keyframes miav-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      #miav-boot { background: #0b1220; }
      #miav-boot .miav-boot-title { color: #e2e8f0; }
    }
  </style>

  <!-- Applique le thème mémorisé AVANT le rendu (évite le flash clair/sombre). -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('ekklesia_theme'); // 'light' | 'dark' | 'system'
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        /* stockage indisponible : on laisse le thème par défaut */
      }
    })();
  </script>
</head>

<body>
  <div id="miav-boot">
    <img src="/logos/A New Design - Fait avec PosterMyWall.png" alt="MIAV" />
    <div class="miav-boot-title">MIAV ERP</div>
    <div class="miav-boot-spinner"></div>
    <div class="miav-boot-sub">Chargement de l'application…</div>
  </div>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
